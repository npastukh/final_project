services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: project_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/00_create_databases.sql:/docker-entrypoint-initdb.d/00_create_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: delivery_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: delivery_airflow_init
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__FERNET_KEY: "0C2Q3zZr7K3aV35lpKqOieRP70dNDO7xjMnIKh4j_w4="
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://project_user:project_password@postgres:5432/airflow
      AIRFLOW_CONN_DWH_POSTGRES: postgresql+psycopg2://project_user:project_password@postgres:5432/dwh
      AIRFLOW__WEBSERVER__SECRET_KEY: "delivery-project-secret"
      JAVA_HOME: /usr/lib/jvm/default-java
      PYTHONPATH: /opt/project/airflow/include:/opt/project/airflow/scripts
      PROJECT_ROOT: /opt/project
      PROJECT_DATA_DIR: /opt/project/data/raw
      PROJECT_SQL_DIR: /opt/project/sql
      DWH_HOST: postgres
      DWH_PORT: "5432"
      DWH_DB: dwh
      DWH_USER: project_user
      DWH_PASSWORD: project_password
      AIRFLOW_UID: "50000"
    user: "50000:0"
    entrypoint: []
    depends_on:
      postgres:
        condition: service_healthy
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/project/airflow/scripts
      - ./airflow/include:/opt/project/airflow/include
      - ./sql:/opt/project/sql
      - ./data:/opt/project/data
      - airflow_logs:/opt/airflow/logs
    command:
      - /bin/bash
      - -lc
      - |
        airflow db migrate &&
        (
          airflow users list | grep -q "admin" ||
          airflow users create \
            --username admin \
            --password admin \
            --firstname Airflow \
            --lastname Admin \
            --role Admin \
            --email admin@example.com
        )

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: delivery_airflow_scheduler
    restart: unless-stopped
    environment: *airflow-env
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow-volumes
    command: ["scheduler"]

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: delivery_airflow_webserver
    restart: unless-stopped
    environment: *airflow-env
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: ["webserver"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  pgadmin_data:
  airflow_logs:
